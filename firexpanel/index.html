<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="FirexPanel" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-FPfix2025.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dou2Vpxs.css">
    <!-- Message Keyword Checker + number stars (addon, 2026-11-18).
         Separate from the built bundle: the panel ships with no frontend
         source, so this addon adds the checker UI + star buttons from
         outside the React app. See assets/checker-addon.js for details. -->
    <link rel="stylesheet" href="/assets/checker-addon.css?v=20261119">
    <script src="/assets/checker-addon.js?v=20261119" defer></script>
  </head>
  <body>
    <div id="root"></div>

    <div id="fx-fallback" style="display:none;position:fixed;inset:0;background:#0b0f14;color:#e6e9ee;font-family:Inter,system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;z-index:999999;">
      <div style="max-width:460px;">
        <div style="font-size:18px;font-weight:600;margin-bottom:8px;">FirexPanel couldn't load</div>
        <div style="font-size:14px;color:#9aa4b2;margin-bottom:16px;line-height:1.5;">
          This is usually a temporary loading issue, not a data problem — your saved accounts are safe and untouched.
        </div>
        <pre id="fx-error-detail" style="display:none;text-align:left;background:#151b23;border:1px solid #2a333f;border-radius:8px;padding:12px;font-size:11px;color:#f2b8b5;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;margin-bottom:16px;"></pre>
        <button id="fx-retry-btn" style="background:#2f6fed;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">
          Reload page
        </button>
      </div>
    </div>

    <script>
      // --- Render watchdog: shows a visible fallback instead of a silent
      // black screen if the app fails to mount or throws during startup,
      // and surfaces the actual error text so it can be diagnosed from a
      // screenshot. Uses only in-memory state + sessionStorage (per-tab,
      // cleared on close) for a single auto-retry — never touches
      // localStorage.
      (function () {
        var root = document.getElementById('root');
        var fallback = document.getElementById('fx-fallback');
        var detailEl = document.getElementById('fx-error-detail');
        var shown = false;

        function showFallback(detail) {
          if (shown) return;
          shown = true;
          if (detail) {
            detailEl.textContent = detail;
            detailEl.style.display = 'block';
          } else {
            detailEl.textContent = 'No script error was captured — the app just did not finish rendering in time on this device/network.\nUA: ' + navigator.userAgent;
            detailEl.style.display = 'block';
          }
          fallback.style.display = 'flex';
        }

        document.getElementById('fx-retry-btn').addEventListener('click', function () {
          window.location.reload();
        });

        window.addEventListener('error', function (e) {
          var msg = 'Error: ' + (e.message || 'unknown') +
            '\nFile: ' + (e.filename || 'n/a') + ':' + (e.lineno || '?') + ':' + (e.colno || '?');
          if (e.error && e.error.stack) msg += '\nStack: ' + e.error.stack;
          showFallback(msg);
        });

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = 'Unhandled promise rejection: ' +
            (reason && reason.message ? reason.message : String(reason));
          if (reason && reason.stack) msg += '\nStack: ' + reason.stack;
          showFallback(msg);
        });

        // If nothing has been rendered into #root within 6s, assume the
        // app failed silently (blocked script, unsupported browser, etc).
        setTimeout(function () {
          if (!root || root.childElementCount === 0) {
            var retried = sessionStorage.getItem('fx_auto_retried');
            if (!retried) {
              sessionStorage.setItem('fx_auto_retried', '1');
              window.location.reload();
            } else {
              showFallback(null);
            }
          }
        }, 6000);
      })();
    </script>

    <script>
      // Auto-heals stale deployments: periodically checks the live index.html
      // for a newer build and reloads to pick it up. Only uses fetch() + a
      // plain page reload — never touches localStorage/site data.
      (function () {
        var myScript = document.querySelector('script[type="module"][src*="/assets/index-"]');
        var myBuild = myScript ? myScript.getAttribute('src') : null;
        if (!myBuild) return;

        function checkForUpdate() {
          fetch('/index.html?_=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/\/assets\/index-[A-Za-z0-9]+\.js/);
              if (m && m[0] !== myBuild) {
                window.location.reload();
              }
            })
            .catch(function () {});
        }

        setInterval(checkForUpdate, 60000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
      })();
    </script>
  </body>
</html>
